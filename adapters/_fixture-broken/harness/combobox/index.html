<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handrail — deliberately broken combobox</title>
  </head>
  <body>
    <!--
      A naive "autocomplete" of the kind that ships constantly: a plain text
      input with a div of clickable rows under it. It looks fine and works with
      a mouse. See expected.json for the catalogue.
    -->
    <button data-testid="hr-before" type="button">Before</button>

    <!-- DEFECT: no role=combobox, no aria-expanded, no aria-controls. -->
    <input data-testid="hr-combobox" type="text" aria-label="Choose a fruit" />

    <!-- DEFECT: no role=listbox, no role=option, no active-option tracking. -->
    <div data-testid="hr-listbox" hidden>
      <div data-testid="hr-option-1">Apple</div>
      <div data-testid="hr-option-2">Banana</div>
      <div data-testid="hr-option-3">Cherry</div>
    </div>

    <button data-testid="hr-after" type="button">After</button>

    <script type="module">
      const input = document.querySelector('[data-testid="hr-combobox"]');
      const listbox = document.querySelector('[data-testid="hr-listbox"]');

      // DEFECT: opens on Down Arrow and does nothing else — no active option,
      // no Enter to select, no Escape to close, no state communicated.
      input.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") listbox.hidden = false;
      });

      for (const option of listbox.children) {
        option.addEventListener("click", () => {
          input.value = option.textContent;
          listbox.hidden = true;
        });
      }

      window.__HANDRAIL__ = {
        protocolVersion: 1,
        library: "_fixture-broken",
        libraryVersions: { "_fixture-broken": "0.1.0" },
        adapterVersion: "0.1.0",
        component: "combobox",
        notes: "Deliberately broken calibration fixture. Never publish results for this target.",
      };

      requestAnimationFrame(() =>
        requestAnimationFrame(() => document.body.setAttribute("data-handrail-ready", "true")),
      );
    </script>
  </body>
</html>
