<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Railing, deliberately broken fixture</title>
  </head>
  <body>
    <!--
      A naive dialog with catalogued defects. See expected.json and README.md.

      Written in vanilla HTML and JavaScript on purpose. It is the proof that the
      harness protocol is HTTP and HTML rather than React: the runner cannot tell
      that this adapter has no framework, no build step and no components.
    -->
    <button data-testid="hr-before" type="button">Before</button>
    <button data-testid="hr-trigger" type="button">Open dialog</button>
    <button data-testid="hr-outside-content" type="button">Content outside the dialog</button>
    <button data-testid="hr-after" type="button">After</button>

    <!-- DEFECT: role="dialog" with no accessible name. -->
    <div data-testid="hr-dialog" role="dialog" hidden>
      <h2 data-testid="hr-title">Railing test dialog</h2>
      <input data-testid="hr-field-1" type="text" aria-label="Field one" />
      <input data-testid="hr-field-2" type="text" aria-label="Field two" />
      <!-- DEFECT: icon-only close button with no accessible name. -->
      <button data-testid="hr-close" type="button"><span aria-hidden="true">&times;</span></button>
    </div>

    <script type="module">
      const dialog = document.querySelector('[data-testid="hr-dialog"]');

      // DEFECT: opens the dialog and nothing else. No focus move, no focus
      // trap, no Escape handler, no focus restoration, no background inerting.
      document.querySelector('[data-testid="hr-trigger"]').addEventListener("click", () => {
        dialog.hidden = false;
      });

      document.querySelector('[data-testid="hr-close"]').addEventListener("click", () => {
        dialog.hidden = true;
      });

      window.__RAILING__ = {
        protocolVersion: 1,
        library: "_fixture-broken",
        libraryVersions: { "_fixture-broken": "0.1.0" },
        adapterVersion: "0.1.0",
        component: "dialog",
        notes: "Deliberately broken calibration fixture. Never publish results for this target.",
      };

      requestAnimationFrame(() =>
        requestAnimationFrame(() => document.body.setAttribute("data-railing-ready", "true")),
      );
    </script>
  </body>
</html>
