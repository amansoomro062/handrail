name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Typecheck and version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      # Catches a version claim that disagrees with what is installed, and a
      # stale result naming a version nobody can install any more.
      - run: pnpm check:versions

  calibrate:
    name: Calibration against the broken fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Filtered to the package that owns playwright. pnpm does not hoist
      # binaries, so `pnpm exec playwright` at the workspace root finds nothing
      # on a clean machine, and on a developer's machine it may find an
      # unrelated global install at a different version.
      - run: pnpm --filter @handrail/runner exec playwright install --with-deps chromium

      # Serving and testing live in one step on purpose. A server backgrounded
      # in one step and used in the next depends on the process surviving
      # between shells, which is a needless thing to rely on.
      #
      # The fixture has a catalogued list of deliberate defects. The runner must
      # detect exactly those and no others, which is what stops a false positive
      # or a false negative reaching a published result.
      - name: Calibrate every spec against the broken fixture
        run: |
          set -euo pipefail
          pnpm --filter @handrail/fixture-broken run dev &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          npx --yes wait-on http://localhost:5199/harness/dialog --timeout 60000

          for spec in dialog combobox menu tabs accordion; do
            pnpm handrail run --target _fixture-broken --component "$spec" \
              --base-url http://localhost:5199 \
              --expect adapters/_fixture-broken/expected.json
          done
