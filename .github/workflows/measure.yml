name: Measure

# Re-runs every spec against every library and rebuilds the index.
#
# Weekly rather than on push, because the thing being measured is not this
# repository. It is a set of libraries that change on their own schedule, and
# the point of running continuously is to catch the release where one of them
# regresses.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  measure:
    name: Run every spec against every library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @railing-dev/runner exec playwright install --with-deps chromium

      - name: Measure every library
        run: |
          set -euo pipefail

          for a in radix react-spectrum mui headlessui chakra antd shadcn; do
            pnpm --filter "@railing-dev/adapter-$a" run dev &
          done
          pnpm --filter @railing-dev/fixture-broken run dev &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

          for port in 5180 5181 5182 5183 5184 5185 5186 5199; do
            npx --yes wait-on "http://localhost:$port/harness/dialog" --timeout 120000
          done

          # Calibration first. If the runner cannot tell a broken dialog from a
          # good one today, nothing measured after it is worth publishing.
          for spec in dialog combobox menu tabs accordion; do
            pnpm railing run --target _fixture-broken --component "$spec" \
              --base-url http://localhost:5199 \
              --expect adapters/_fixture-broken/expected.json
          done

          # --repeat 3 fails the run if any assertion's status varies. An
          # intermittent result must never reach the index.
          declare -A ports=( [radix]=5180 [react-spectrum]=5181 [mui]=5182 \
            [headlessui]=5183 [chakra]=5184 [antd]=5185 [shadcn]=5186 )
          for target in "${!ports[@]}"; do
            for spec in dialog combobox menu tabs accordion; do
              pnpm railing run --target "$target" --component "$spec" \
                --base-url "http://localhost:${ports[$target]}" --repeat 3
            done
          done

      - run: pnpm check:versions
      - run: pnpm site:build

      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: web/out
