name: Pages

# Builds the site from the results committed in the repository and publishes it.
#
# Deliberately does not re-measure. Measuring is the Measure workflow's job, and
# it commits its results; this one only renders what is already there. Keeping
# them separate means a change to the site cannot silently change a score, and a
# deploy takes seconds rather than a quarter of an hour.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/markdown/**"
      - "docs/**"
      - "results/**"
      - "targets.json"
      - "packages/report/**"
      - "packages/spec/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A published page must never disagree with the versions it claims to
      # describe, so the same check that guards the results guards the deploy.
      - run: pnpm check:versions
      # The gate is a test. If a notification date is wrong, the deploy stops
      # here rather than publishing a score nobody has been told about.
      - run: pnpm --filter @railing/web run test
      - run: pnpm --filter @railing/web run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
